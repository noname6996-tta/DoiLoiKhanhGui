<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="newyearletter.css">
    <link rel="icon" href="./icon.png">
    <title>Countdown Web</title>
</head>

<body>
    <div class="layout_out_side">
        <div class="heading">
            <h3 id="title">Đếm ngày Khánh về</h3>
            <h1>Chờ đợi là hạnh phúc...</h1>
        </div>

        <div class="countdown">
            <div class="box">
                <span class="num" id="days">02</span>
                <span class="text">Days</span>
            </div>
            <div class="box">
                <span class="num" id="hours">02</span>
                <span class="text">Hours</span>
            </div>
            <div class="box">
                <span class="num" id="minutes">02</span>
                <span class="text">Minutes</span>
            </div>
            <div class="box">
                <span class="num" id="seconds">02</span>
                <span class="text">Seconds</span>
            </div>
        </div>
    </div>

    <div class="letter" onclick="display_letter()" id="note2">
        <div class="page increment " id="base" id="myinsp">
            <div class="arrow-down"></div>
            <div class="bottom_from">Gửi Khánh</div>
            <div id="hny">Mau về nhé!</div>
        </div>
    </div>

    <script>
        let display_letter = () => {
            let root = document.documentElement;
            let base = document.getElementById('base')

            root.style.setProperty('--page-height', '200px');
            document.getElementById('hny').style.display = "block";
            base.classList.remove('increment')
        }
    </script>

    <script>
        // Đặt ngày đếm ngược, ở đây mình đặt ngày đếm ngược là 04/03/2028
        //March: Tháng ba, 04: Ngày, 2028: Năm, 00:00:00
        var countDownDate = new Date("March 04, 2028 00:00:00").getTime();
        // setInterval: Cập nhật đếm ngược sau mỗi 1 giây.
        // 1000: 1 giây
        //sau khi cập nhật trên git
        var x = setInterval(function () {

            // Ngày và giờ hôm nay
            var now = new Date().getTime();

            // Làm phép tính để đếm khoảng cách ngày hôm nay và ngày đếm ngược
            var distance = countDownDate - now;

            // Tính toán thời gian cho ngày, giờ, phút và giây
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days,
                document.getElementById("hours").innerText = hours,
                document.getElementById("minutes").innerText = minutes,
                document.getElementById("seconds").innerText = seconds

            // Nếu kết thúc quá trình đếm ngược thì in ra thông báo gì đó
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("title").innerHTML = "Khánh đã về! Chào mừng trở lại!";
                var title2 = document.getElementById("title2");
                if (title2) title2.style.display = 'none';
                var note = document.getElementById("note");
                if (note) note.style.display = 'block';
                var imgVini = document.getElementById("imgVini");
                if (imgVini) imgVini.style.display = 'block';
                var note2 = document.getElementById("note2");
                if (note2) note2.style.display = 'block';
                document.getElementById("days").innerText = 0,
                    document.getElementById("hours").innerText = 0,
                    document.getElementById("minutes").innerText = 0,
                    document.getElementById("seconds").innerText = 0
            }
        }, 1000);
    </script>
</body>

</html>
